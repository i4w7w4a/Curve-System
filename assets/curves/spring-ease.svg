<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Пружина с нормировкой конца</title>
<desc id="desc">Пружинная форма на фиксированном интервале с точными значениями 0 и 1. Ось x: нормализованное время t от 0 до 1. Ось y: значение f(t). Пунктир — линейный переход. График вычислен исходным evaluator Curve System.</desc>
